name: MiniBank CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-unit-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: |
          for project in tests/Unit/*/; do
            name=$(basename "$project")
            dotnet test "$project" \
              --configuration Release --no-build \
              --logger "trx;LogFileName=$name.trx" \
              --results-directory ./test-results
          done

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      # Testcontainers starts PostgreSQL in Docker, which is available on GitHub-hosted runners
      - name: Run integration tests
        run: |
          for project in tests/Integration/*.IntegrationTests/; do
            name=$(basename "$project")
            dotnet test "$project" \
              --configuration Release --no-restore \
              --logger "trx;LogFileName=$name.trx" \
              --results-directory ./test-results
          done

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/

  docker-build:
    name: Docker Build (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: IamService, image: iam-service, context: src/Services/MiniBank.IamService }
          - { name: AccountService, image: account-service, context: src/Services/MiniBank.AccountService }
          - { name: CardService, image: card-service, context: src/Services/MiniBank.CardService }
          - { name: AuthorizationService, image: authorization-service, context: src/Services/MiniBank.AuthorizationService }
          - { name: TransactionService, image: transaction-service, context: src/Services/MiniBank.TransactionService }
          - { name: InstallmentService, image: installment-service, context: src/Services/MiniBank.InstallmentService }
          - { name: FraudService, image: fraud-service, context: src/Services/MiniBank.FraudService }
          - { name: EodService, image: eod-service, context: src/Services/MiniBank.EodService }
          - { name: ReconciliationService, image: reconciliation-service, context: src/Services/MiniBank.ReconciliationService }
          - { name: NotificationService, image: notification-service, context: src/Services/MiniBank.NotificationService }
          - { name: ApiGateway, image: api-gateway, context: src/Gateway/MiniBank.ApiGateway }
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f ${{ matrix.service.context }}/Dockerfile \
            -t minibank-${{ matrix.service.image }}:ci \
            .
